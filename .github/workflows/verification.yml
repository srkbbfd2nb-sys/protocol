name: vérification

on:
  push:
  pull_request:

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pytest
        run: pip install --quiet pytest

      - name: Tests de l'instrument
        run: python -m pytest lab/tests/ -q

      # Code de sortie EXACT, fixture par fixture. Tester seulement « non nul »
      # laissait passer un refus pour la mauvaise raison — un chemin faux, par
      # exemple, sortait en 1 comme une vraie non-conformité.
      - name: Chaque fixture rend exactement le code attendu
        run: |
          echec=0
          while read -r fixture attendu; do
            python lab/audit_v8.py --input-file "lab/fixtures/$fixture" > /dev/null && code=0 || code=$?
            if [ "$code" -ne "$attendu" ]; then
              echo "ÉCHEC — $fixture : attendu $attendu, obtenu $code"; echec=1
            else
              echo "ok — $fixture → $code"
            fi
          done <<'LISTE'
          conforme.txt 0
          ancien-jeton.txt 0
          coherence-violee.txt 1
          sections-manquantes.txt 1
          sans-delimiteurs.txt 1
          axe-hors-plage.txt 1
          enumeration-inconnue.txt 1
          bloc-absent.txt 2
          json-invalide.txt 2
          LISTE
          exit $echec

      - name: Aucune fixture n'est laissée hors de la liste
        run: |
          n=$(ls lab/fixtures/*.txt | wc -l)
          [ "$n" -eq 9 ] || { echo "ÉCHEC — $n fixtures, 9 listées : ajouter la nouvelle à l'étape précédente"; exit 1; }

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dualité des couches — un module, une fiche de détail
        run: |
          m=$(ls protocole/actif/*.md | grep -vE 'README|emission' | wc -l)
          d=$(ls protocole/archive/*_detail.md | wc -l)
          echo "modules=$m détails=$d"
          [ "$m" -eq "$d" ] || { echo "ÉCHEC — rupture de la dualité S4"; exit 1; }

      - name: Le paquet Skill ne diverge pas de la source
        run: |
          for f in protocole/actif/*.md; do
            b=$(basename "$f"); s="skill/references/$b"
            [ "$b" = "README.md" ] && continue
            cmp -s "$f" "$s" || { echo "ÉCHEC — $b diffère entre protocole/ et skill/"; exit 1; }
          done
          echo "les deux copies sont identiques"

      - name: Le délimiteur du template et celui du vérificateur concordent
        run: |
          grep -q "===== LAB AUDIT JSON =====" protocole/actif/emission_audit_v8.md
          grep -q "LAB|TJ" lab/audit/v8/json_extractor.py

      # La concordance schéma ↔ template (énumération par énumération) est
      # couverte par lab/tests, qui tourne dans le job « instrument ».
      - name: L'instrument n'importe que la bibliothèque standard
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          autorises = set(sys.stdlib_module_names) | {"audit"}
          fautes = []
          for f in pathlib.Path("lab").rglob("*.py"):
              if "tests" in f.parts:
                  continue
              for n in ast.walk(ast.parse(f.read_text(encoding="utf-8"))):
                  noms = [a.name for a in n.names] if isinstance(n, ast.Import) else \
                         [n.module] if isinstance(n, ast.ImportFrom) and n.module and n.level == 0 else []
                  fautes += [f"{f}: {m}" for m in noms if m.split(".")[0] not in autorises]
          print("\n".join(fautes) or "bibliothèque standard seule")
          sys.exit(1 if fautes else 0)
          PY
